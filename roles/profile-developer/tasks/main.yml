---
- name: Add Homebrew tap for Granted
  homebrew_tap: tap=common-fate/granted state=present trust=true

- name: Add Homebrew tap for Packer
  homebrew_tap: tap=hashicorp/tap state=present trust=true

- name: "[Developer] Install developer brew applications"
  homebrew: name={{item}} state=latest
  with_items:
    - awscli
    - bat
    - csvkit
    - direnv
    - htop
    - httpie
    - granted
    - pwgen
    - rsync
    - shellcheck
    - watch
    - wget
#    - yarn # Use corepack now
    - tmux
    - libpq
    - yamllint
    # hashicorp/tap
    - packer
#    - temurin

- name: "Link libpq so we get client executables without needing full PG"
  command: "brew link --force libpq"

- name: "[Developer] Install developer cask applications"
  homebrew_cask: 
    name: "{{item}}"
    state: present
    install_options:
    - cask
    - appdir=/Applications
  with_items:
    - aws-vault
    - boop
    - datagrip
    - drawio
    - monodraw
    - gpg-suite
    - imageoptim
    - intellij-idea
    - iterm2
    - insomnia
    # - ksdiff
    - ngrok
    - pop
    - postman
    - orbstack

- name: "[Developer] Install developer cask applications with root"
  homebrew_cask: 
    name: "{{item}}"
    state: present
    sudo_password: "{{ansible_become_password}}"
    install_options:
    - cask
    - appdir=/Applications
  with_items:
    - session-manager-plugin
    - orbstack
    - wireshark

- name: "[Developer] Download Hosts App"
  get_url:
    url: https://www.dirk-froehling.de/resources/Software/Hosts-App-1.4.5.zip
    dest: "{{ home_dir }}/Downloads"

- name: "[Developer] Unpack Hosts App"
  become: yes
  unarchive:
    remote_src: yes
    src: "{{ home_dir }}/Downloads/Hosts-App-1.4.5.zip"
    dest: "/Applications"

- name: "[Developer] Copy dotfiles"
  copy: src=files/{{ user_name }}/{{ item }} dest={{ home_dir }}/.{{ item }}
  with_items:
  - vimrc

- name: Write out gitconfig
  template: src=gitconfig.j2 dest={{ home_dir }}/.gitconfig

- name: "[Developer] Install completions"
  homebrew: name={{item}} state=latest
  with_items:
    - bundler-completion
    - gem-completion
    - pip-completion
    - rails-completion
    - rake-completion
    - ruby-completion
    - yarn-completion
    - zsh-completions

- name: "[Developer] Ensure ~/Applications dir"
  file: path="{{ home_dir }}/Applications" state=directory

- name: "[Developer] Activate direnv"
  lineinfile:
    dest: "{{home_dir}}/.zshrc"
    line: eval "$(direnv hook bash)"

- name: "[Developer] Ensure .aws directory"
  file: path="{{ home_dir }}/.aws" state=directory

- name: "[Developer] AWS Base config file"
  blockinfile:
    dest: "{{ home_dir }}/.aws/config"
    create: yes
    block: |
      [default]
      output=json
      region=ap-southeast-2

- name: "[Developer] Ensure home bin directory"
  file:
    path: "{{ home_dir }}/bin"
    state: directory
